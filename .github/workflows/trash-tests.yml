name: Trash regression tests

on:
  push:
    branches:
      - fix/file-operations
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  trash-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: |
          bash -n lib/10-utils.sh
          bash -n lib/50-fileops.sh
          bash -n lib/60-trash.sh
          bash -n tests/test-trash.sh
      - name: Run trash regression tests
        run: bash tests/test-trash.sh
