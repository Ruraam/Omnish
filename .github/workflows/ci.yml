name: Omnish CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bash-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Bash syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f \( -name '*.sh' -o -name omnish \) -not -path './.git/*' -print0)
      - name: ShellCheck errors
        run: |
          set -euo pipefail
          shellcheck --shell=bash --severity=error install.sh uninstall.sh omnish lib/*.sh tests/*.sh
      - name: Regression tests
        run: bash tests/regression.sh
      - name: Install real archive fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools genisoimage gcab binutils curl
      - name: Real Quick Archive format integration
        run: bash tests/archive_real_formats.sh
      - name: Quick Archive security and stress integration
        run: bash tests/archive_security.sh
      - name: Quick Archive magic detection integration
        run: bash tests/archive_magic_detection.sh
      - name: Quick Archive nested archive integration
        run: bash tests/archive_nested.sh
      - name: Quick Archive v2 browser integration
        run: bash tests/archive_browser_v2.sh
      - name: Installer integration tests
        run: bash tests/install.sh
      - name: Checkout ULPM packaging engine
        uses: actions/checkout@v4
        with:
          repository: Ruraam/ulpm
          ref: main
          path: ulpm-src
      - name: Install SquashFS and ULPM packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools zstd jq openssl file
      - name: Real ULPM LPK integration
        run: bash tests/lpk_ulpm_integration.sh "$GITHUB_WORKSPACE/ulpm-src"
      - name: PTY integration tests
        run: python3 tests/pty_integration.py
