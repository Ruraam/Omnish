<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Omnish</title>
  <desc id="desc">Omnish terminal file manager icon, matching the project's dark and turquoise banner identity.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="1" stop-color="#151e28"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ec9b0"/>
      <stop offset="1" stop-color="#89ddff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#background)" stroke="#303b46" stroke-width="3"/>
  <path d="M8 64H248" stroke="#4ec9b0" stroke-opacity=".22" stroke-width="2"/>
  <circle cx="38" cy="37" r="6" fill="#f07178"/>
  <circle cx="59" cy="37" r="6" fill="#ffcb6b"/>
  <circle cx="80" cy="37" r="6" fill="#a6e3a1"/>
  <rect x="32" y="78" width="192" height="132" rx="16" fill="#0d1117" stroke="#3b4854" stroke-width="2"/>
  <path d="M54 112h24l10 12h45v53H54z" fill="#4ec9b0" fill-opacity=".13" stroke="url(#accent)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M54 132h148" stroke="#303b46" stroke-width="3"/>
  <path d="M91 151l13 10-13 10" fill="none" stroke="#89ddff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <rect x="112" y="166" width="42" height="6" rx="3" fill="#ffcb6b"/>
  <text x="128" y="235" text-anchor="middle" font-family="monospace" font-size="17" font-weight="700" letter-spacing="2" fill="#e6edf3">OMNISH</text>
</svg>
