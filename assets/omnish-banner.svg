<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">omnish — modular file manager &amp; system console</title>
  <desc id="desc">omnish v3.0 banner: pure-bash file manager with fzf and loop backends, disk usage panel, CPU monitor, and BubbleOS system console.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="1" stop-color="#0f141c"/>
    </linearGradient>

    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#e6edf3"/>
      <stop offset="0.75" stop-color="#e6edf3"/>
      <stop offset="1"   stop-color="#4ec9b0"/>
    </linearGradient>

    <linearGradient id="bar1" x1="0" x2="1">
      <stop offset="0" stop-color="#4ec9b0"/>
      <stop offset="1" stop-color="#89ddff"/>
    </linearGradient>

    <linearGradient id="bar2" x1="0" x2="1">
      <stop offset="0" stop-color="#ffcb6b"/>
      <stop offset="1" stop-color="#f07178"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.32" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#4ec9b0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4ec9b0" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#4ec9b0" stroke-width="0.5" opacity="0.04"/>
    </pattern>

    <filter id="cursor-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>
  <ellipse cx="500" cy="280" rx="520" ry="320" fill="url(#glow)"/>

  <!-- Top-left version tag -->
  <g transform="translate(60, 56)">
    <rect x="0" y="0" width="220" height="28" rx="4" fill="none" stroke="#4ec9b0" stroke-opacity="0.35"/>
    <circle cx="16" cy="14" r="3" fill="#4ec9b0"/>
    <text x="28" y="19" font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace"
          font-size="13" fill="#4ec9b0" letter-spacing="2">v3.0 · BUBBLEOS</text>
  </g>

  <!-- Wordmark -->
  <text x="60" y="260"
        font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace"
        font-size="160" font-weight="700" letter-spacing="-6"
        fill="url(#wordmark)">omnish</text>

  <!-- Blinking cursor -->
  <rect x="705" y="135" width="22" height="95" fill="#ffcb6b" opacity="0.9" filter="url(#cursor-glow)">
    <animate attributeName="opacity" values="0.9;0.9;0.1;0.1;0.9" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Tagline -->
  <text x="62" y="320"
        font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace"
        font-size="24" fill="#8b949e" letter-spacing="0.5">
    <tspan fill="#4ec9b0">$</tspan> modular file manager &amp; system console
  </text>

  <!-- Badges -->
  <g transform="translate(60, 400)"
     font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="14">
    <rect x="0" y="0" width="150" height="32" rx="16"
          fill="#4ec9b0" fill-opacity="0.1" stroke="#4ec9b0" stroke-opacity="0.3"/>
    <circle cx="18" cy="16" r="4" fill="#a6e3a1"/>
    <text x="32" y="21" fill="#c9d1d9">pure bash</text>

    <rect x="165" y="0" width="160" height="32" rx="16"
          fill="#89ddff" fill-opacity="0.1" stroke="#89ddff" stroke-opacity="0.3"/>
    <circle cx="183" cy="16" r="4" fill="#89ddff"/>
    <text x="197" y="21" fill="#c9d1d9">fzf + loop</text>

    <rect x="340" y="0" width="190" height="32" rx="16"
          fill="#ffcb6b" fill-opacity="0.1" stroke="#ffcb6b" stroke-opacity="0.3"/>
    <circle cx="358" cy="16" r="4" fill="#ffcb6b"/>
    <text x="372" y="21" fill="#c9d1d9">bubbleos ready</text>
  </g>

  <!-- Terminal panel (right) -->
  <g transform="translate(960, 70)">
    <rect x="4" y="4" width="560" height="360" rx="10" fill="#000" opacity="0.35"/>
    <rect x="0" y="0" width="560" height="360" rx="10" fill="#0d1117" stroke="#30363d"/>

    <circle cx="24" cy="24" r="6" fill="#f07178"/>
    <circle cx="46" cy="24" r="6" fill="#ffcb6b"/>
    <circle cx="68" cy="24" r="6" fill="#a6e3a1"/>

    <text x="280" y="28" text-anchor="middle"
          font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace"
          font-size="12" fill="#6b7280">omnish — /home/user</text>

    <line x1="0" y1="48" x2="560" y2="48" stroke="#30363d"/>

    <!-- File listing -->
    <g font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace" font-size="16">
      <text x="24" y="80" fill="#4ec9b0" font-weight="600">▸ /home/user</text>

      <text x="24" y="112" fill="#89ddff">▸ documents/</text>
      <text x="24" y="140" fill="#89ddff">▸ projects/</text>
      <text x="24" y="168" fill="#89ddff">▸ .config/</text>

      <text x="24" y="196" fill="#e6edf3">  README.md</text>
      <text x="24" y="224" fill="#ffcb6b">* omnish.conf</text>
      <text x="24" y="252" fill="#e6edf3">  screenshot.png</text>
    </g>

    <line x1="24" y1="272" x2="536" y2="272" stroke="#30363d" opacity="0.6"/>

    <!-- Disk usage mini-panel -->
    <g font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace">
      <text x="24" y="292" font-size="11" fill="#6b7280" letter-spacing="1">DISK USAGE</text>

      <rect x="24" y="302" width="360" height="6" rx="3" fill="#21262d"/>
      <rect x="24" y="302" width="216" height="6" rx="3" fill="url(#bar1)"/>
      <text x="396" y="309" font-size="11" fill="#4ec9b0">60%</text>

      <rect x="24" y="318" width="360" height="6" rx="3" fill="#21262d"/>
      <rect x="24" y="318" width="115" height="6" rx="3" fill="url(#bar2)"/>
      <text x="396" y="325" font-size="11" fill="#ffcb6b">32%</text>
    </g>

    <!-- Status bar -->
    <rect x="0" y="336" width="560" height="24" fill="#161b22"/>
    <text x="24" y="352"
          font-family="'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace"
          font-size="11" fill="#6b7280">Tab select · ^U dua · ^X system · q quit</text>
  </g>

  <!-- Bottom-right accent dots -->
  <g transform="translate(1480, 440)" opacity="0.55">
    <circle cx="0" cy="0" r="2" fill="#4ec9b0"/>
    <circle cx="14" cy="0" r="2" fill="#89ddff"/>
    <circle cx="28" cy="0" r="2" fill="#ffcb6b"/>
    <circle cx="42" cy="0" r="2" fill="#f07178"/>
    <circle cx="56" cy="0" r="2" fill="#a6e3a1"/>
  </g>
</svg>